# RESEARCH REF ONLY. Never merge this replacement workflow into product.
# This manual observer does not satisfy or replace either required PR check.
name: H01 fresh-host read-only context

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe-host-context:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.15"
          check-latest: false
      # Exact already-reviewed prerequisite setup; no other sudo operation.
      # The observer records post-install state and does not execute bwrap.
      - name: Install the Ubuntu sandbox prerequisite
        run: |
          sudo apt-get update
          apt-cache policy bubblewrap
          sudo apt-get install --yes --no-install-recommends bubblewrap
          dpkg-query -W bubblewrap
      - name: Observe allowlisted public host context without isolation attempts
        run: python3 diagnostics/s3-bod-selector/tools/observe_host_context.py --output "$RUNNER_TEMP/h01-host-context.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4
        if: always()
        with:
          name: h01-fresh-host-context
          path: ${{ runner.temp }}/h01-host-context.json
          if-no-files-found: error
